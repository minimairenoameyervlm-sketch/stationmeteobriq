<!DOCTYPE HTML>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projet SI CIT "MétéoBriq'" Noa Victor George Luca</title>
  
  <style>
    body { 
      font-family: 'Segoe UI', Arial, sans-serif; 
      text-align: center; 
      background-color: #f0f2f5; 
      margin: 0;
      padding: 20px;
      color: #333; 
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 90vh;
    }
    
    h1 { 
      color: #1a73e8; 
      margin-bottom: 5px; 
      font-size: 1.8em;
    }
    
    h2 { 
      font-size: 0.9em; 
      color: #666; 
      margin-top: 0; 
      margin-bottom: 25px; 
      font-weight: normal;
      line-height: 1.4;
      padding: 0 10px;
    }
    
    .card { 
      background: white; 
      padding: 25px; 
      border-radius: 15px; 
      box-shadow: 0px 4px 20px rgba(0,0,0,0.08); 
      text-align: left; 
      width: 100%;
      max-width: 350px; /* Parfait pour la largeur d'un smartphone */
      box-sizing: border-box;
    }
    
    p { 
      margin: 18px 0; 
      font-size: 1.1em; 
      display: flex;
      justify-content: space-between; /* Aligne l'émoji/texte à gauche et la valeur à droite */
      align-items: center;
    }
    
    hr { 
      border: 0; 
      height: 1px; 
      background: #eee; 
      margin: 20px 0; 
    }
    
    .time { 
      font-size: 0.8em; 
      color: #999; 
      text-align: center; 
      margin-top: 20px; 
      word-break: break-word; /* Évite que le texte dépasse sur petit écran */
    }
    
    .valeur { 
      font-weight: bold; 
      color: #111; 
      font-family: monospace; /* Plus propre pour l'alignement des chiffres */
      font-size: 1.1em;
    }
  </style>

  <script>
    const baseUrl = "https://aeroxnoameteo.periodicbrake.fr/api/pull/";
    const capteurs = ['temps', 'humidity', 'pressure', 'dust', 'quality'];

    async function recupererCapteur(nom) {
      try {
        const response = await fetch(baseUrl + nom);
        if (!response.ok) return null;
        return await response.json();
      } catch (e) {
        console.error("Erreur sur " + nom, e);
        return null;
      }
    }

    async function chargerToutesLesDonnees() {
      let derniereMaj = "";

      for (const capteur of capteurs) {
        const data = await recupererCapteur(capteur);
        if (data && data.value !== undefined) {
          // On garde la date de mise à jour du dernier capteur lu
          if (data.updated_at) derniereMaj = data.updated_at;

          // On met à jour le bon élément dans la page HTML
          if (capteur === 'temps') document.getElementById('temp').innerText = data.value.toFixed(1) + " °C";
          if (capteur === 'humidity') document.getElementById('humi').innerText = data.value.toFixed(1) + " %";
          if (capteur === 'pressure') document.getElementById('pres').innerText = data.value.toFixed(0) + " hPa";
          if (capteur === 'dust') document.getElementById('dust').innerText = data.value.toFixed(1) + " pcs";
          if (capteur === 'quality') document.getElementById('co2').innerText = data.value.toFixed(0) + " ppm";
        }
      }

      // Affichage de l'heure de la dernière synchronisation
      if (derniereMaj) {
        const date = new Date(derniereMaj);
        document.getElementById('time').innerText = "Dernière mise à jour : " + date.toLocaleTimeString('fr-FR');
      }
    }

    // Relancer la récupération toutes les 5 secondes
    setInterval(chargerToutesLesDonnees, 5000);
    window.onload = chargerToutesLesDonnees;
  </script>
</head>
<body>

  <h1>🌍 Météo Briqu</h1>
  <h2>Noa Meyer, Luca Sforza, Victor Lefèvre, George Martinez</h2>

  <div class="card">
    <p><span>🌡️ Température :</span> <span id="temp" class="valeur">--</span></p>
    <p><span>💧 Humidité :</span> <span id="humi" class="valeur">--</span></p>
    <p><span>🌪️ Pression :</span> <span id="pres" class="valeur">--</span></p>
    <hr>
    <p><span>💨 Qualité de l'air (CO2) :</span> <span id="co2" class="valeur">--</span></p>
    <p><span>🌫️ Poussière :</span> <span id="dust" class="valeur">--</span></p>
    <div class="time" id="time">Connexion a l'API et a l'Arduino R4 Wifi...</div>
  </div>

</body>
</html>
